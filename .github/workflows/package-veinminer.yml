name: Package Veinminer mod
on:
  workflow_dispatch:
  push:
    paths:
      - "mods/veinminer/**"
      - "VEINMINER.md"
      - ".github/workflows/package-veinminer.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .hnmod
        run: python3 mods/veinminer/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: veinminer-hnmod
          path: target/veinminer-*.hnmod
          if-no-files-found: error
